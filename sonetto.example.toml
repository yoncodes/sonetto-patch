# Copy this file to sonetto.toml next to launcher.exe.
# 将本文件复制为 launcher.exe 同目录下的 sonetto.toml。

[tls]
host = "reverse1999.example"
port = 21443
# Optional IPv4 fallback used to redirect direct TLS connections.
# 可选：用于重定向直接 TLS 连接的 IPv4 后备地址。
ipv4 = "192.0.2.10"

[game]
host = "reverse1999.example"
port = 22000
ipv4 = "192.0.2.10"

# Optional process-local HTTP proxy fallback. Only this exact endpoint is
# eligible for CONNECT inspection; all other loopback traffic passes through.
# 可选的进程内 HTTP 代理兜底。只有此精确端点会解析 CONNECT，其他回环流量原样通过。
# [proxy]
# ipv4 = "127.0.0.1"
# port = 8080
